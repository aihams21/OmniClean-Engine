name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --no-pub --no-fatal-infos

  test:
    name: Tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test --reporter expanded

  build-linux:
    name: Build Linux release
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter build linux --release
      - run: python3 tool/packaging/linux_packaging.py deb tar
      - uses: actions/upload-artifact@v4
        with:
          name: omniclean-linux
          path: dist/*
          if-no-files-found: error

  build-web-preview:
    name: Docs asset check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Walkthrough assets are committed
        run: |
          test -f docs/walkthrough/walkthrough-1-dashboard-and-cleaner.gif
          test -f docs/walkthrough/walkthrough-2-quarantine-and-duplicates.gif
          test -f docs/walkthrough/walkthrough-3-settings-themes-languages.gif

  security:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No signing material may ever be committed
        run: |
          set -e
          if git ls-files | grep -Ei '\.(jks|keystore|p12|pem|key)$'; then
            echo "::error::a key file is tracked in git"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)key\.properties$'; then
            echo "::error::key.properties is tracked in git"
            exit 1
          fi
          echo "clean"
